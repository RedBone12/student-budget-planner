name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/src/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install backend dependencies
        run: npm ci --prefix backend/src
      - name: ESLint (frontend and backend)
        run: npm --prefix frontend run lint
      - name: Frontend tests and coverage gate
        run: npm --prefix frontend run coverage
      - name: Backend tests and coverage gate
        run: npm --prefix backend/src run coverage
      - name: Deployment orchestration tests
        run: node --test scripts/*.test.mjs
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/src/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend/src
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser journey against the local API
        run: npm --prefix frontend run test:e2e
      - name: Upload browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  infrastructure:
    name: SAM lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/setup-sam@v2
        with:
          version: '1.166.2'
      - name: Validate SAM and CloudFormation
        run: sam validate --lint --region eu-west-1 --template-file backend/template.yaml
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          SAM_CLI_TELEMETRY: '0'
      - name: Validate OIDC bootstrap infrastructure
        run: sam validate --lint --region eu-west-1 --template-file infra/github-oidc.yaml
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          SAM_CLI_TELEMETRY: '0'
